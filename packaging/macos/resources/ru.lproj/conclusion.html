<h2>Готово</h2>
<p>Служба запущена. Первая синхронизация занимает от нескольких секунд до минуты.</p>
<p>Проверить: откройте «Терминал» и выполните <code>runet-direct status</code>. Строка <code>Health: OK</code> означает, что всё работает.</p>
<p>Остановить на время: <code>sudo runet-direct pause --for 1h</code>. Удалить: <code>sudo runet-direct uninstall</code>.</p>
</body></html>
