<h2>Done</h2>
<p>The service is running. The first sync takes from a few seconds to a minute.</p>
<p>To check, open Terminal and run <code>runet-direct status</code>. <code>Health: OK</code> means everything works.</p>
<p>Pause for a while: <code>sudo runet-direct pause --for 1h</code>. Uninstall: <code>sudo runet-direct uninstall</code>.</p>
</body></html>
