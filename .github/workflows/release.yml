name: Release

# Push a tag like v0.1.0 to publish binaries for every supported system.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-musl,  pack: tar }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, pack: tar }
          - { os: macos-latest,     target: x86_64-apple-darwin,        pack: tar }
          - { os: macos-latest,     target: aarch64-apple-darwin,       pack: tar }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     pack: zip }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package (tar.gz)
        if: matrix.pack == 'tar'
        shell: bash
        run: |
          asset=runet-direct-${{ matrix.target }}.tar.gz
          tar -czf "$asset" -C target/${{ matrix.target }}/release runet-direct
          (shasum -a 256 "$asset" 2>/dev/null || sha256sum "$asset") > "$asset.sha256"
      - name: Package (zip)
        if: matrix.pack == 'zip'
        shell: pwsh
        run: |
          $asset = "runet-direct-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/runet-direct.exe" -DestinationPath $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset" | Out-File -Encoding ascii "$asset.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            runet-direct-${{ matrix.target }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
