name: Release

# Push a tag like v1.0.0 to publish binaries and installers for every supported system.
# A tag with a suffix (v1.0.0-rc.1) is published as a pre-release; its packages carry the plain version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write      # sign build provenance
  attestations: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag%%-*}"   # v1.0.0-rc.1 -> 1.0.0
          cargo_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "$tag" = "$cargo_version" ] || { echo "tag v$tag != Cargo.toml $cargo_version"; exit 1; }

  build:
    needs: check-version
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-musl,  pack: tar }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, pack: tar }
          - { os: macos-latest,     target: x86_64-apple-darwin,        pack: tar }
          - { os: macos-latest,     target: aarch64-apple-darwin,       pack: tar }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     pack: zip }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --sign - target/${{ matrix.target }}/release/runet-direct
      - name: Package (tar.gz)
        if: matrix.pack == 'tar'
        shell: bash
        run: |
          asset=runet-direct-${{ matrix.target }}.tar.gz
          tar -czf "$asset" -C target/${{ matrix.target }}/release runet-direct
          (shasum -a 256 "$asset" 2>/dev/null || sha256sum "$asset") > "$asset.sha256"
      - name: Package (zip)
        if: matrix.pack == 'zip'
        shell: pwsh
        run: |
          $asset = "runet-direct-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/runet-direct.exe" -DestinationPath $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset" | Out-File -Encoding ascii "$asset.sha256"
      - name: Archives for the install scripts
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: |
            runet-direct-${{ matrix.target }}.*
      - name: Raw binary for the installers
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/runet-direct
            target/${{ matrix.target }}/release/runet-direct.exe
          if-no-files-found: ignore

  package-linux:
    needs: build
    name: .deb and .rpm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: raw-*-linux-musl
          path: raw
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build packages
        run: |
          v="${GITHUB_REF_NAME#v}"; v="${v%%-*}"
          mkdir dist
          packaging/linux/build-deb.sh raw/raw-x86_64-unknown-linux-musl/runet-direct  amd64   "$v" dist/runet-direct-linux-amd64.deb
          packaging/linux/build-deb.sh raw/raw-aarch64-unknown-linux-musl/runet-direct arm64   "$v" dist/runet-direct-linux-arm64.deb
          packaging/linux/build-rpm.sh raw/raw-x86_64-unknown-linux-musl/runet-direct  x86_64  "$v" dist/runet-direct-linux-x86_64.rpm
          packaging/linux/build-rpm.sh raw/raw-aarch64-unknown-linux-musl/runet-direct aarch64 "$v" dist/runet-direct-linux-aarch64.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-linux
          path: dist/*

  package-macos:
    needs: build
    name: macOS .pkg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: raw-*-apple-darwin
          path: raw
      - name: One package for Intel and Apple Silicon
        run: |
          v="${GITHUB_REF_NAME#v}"; v="${v%%-*}"
          mkdir dist
          lipo -create -output runet-direct-universal \
            raw/raw-x86_64-apple-darwin/runet-direct raw/raw-aarch64-apple-darwin/runet-direct
          chmod +x runet-direct-universal
          codesign --force --sign - runet-direct-universal
          packaging/macos/build-pkg.sh runet-direct-universal "$v" dist/runet-direct-macos.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-macos
          path: dist/*

  package-windows:
    needs: build
    name: Windows setup.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: raw-x86_64-pc-windows-msvc
          path: raw
      - run: choco install innosetup -y --no-progress
      - name: Build the installer
        shell: pwsh
        run: |
          $v = ("${{ github.ref_name }}".TrimStart('v') -split '-')[0]
          .\packaging\windows\build-installer.ps1 -Exe raw\runet-direct.exe -Version $v -Out dist\runet-direct-setup-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows
          path: dist/*

  publish:
    needs: [build, package-linux, package-macos, package-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: collected
          pattern: "{archive-*,pkg-*}"
          merge-multiple: true
      - name: Checksums of everything
        run: |
          cd collected
          ls -la
          sha256sum $(ls | grep -v -e '\.sha256$') > SHA256SUMS.txt
      - name: Attest build provenance (verifiable with `gh attestation verify`)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            collected/*.tar.gz
            collected/*.zip
            collected/*.deb
            collected/*.rpm
            collected/*.pkg
            collected/*.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: collected/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
